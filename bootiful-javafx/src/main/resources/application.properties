spring.application.name=bootiful-javafx
#
# the embedded Tomcat exists for exactly one route: the redirect at the end of the authorization code
# flow. Loopback only - this is a desktop app, and nothing but the browser on this machine has any
# business reaching it - on the port the authorization server has registered for this client.
server.address=127.0.0.1
server.port=8385
#
# a public client: no secret ships with the desktop app, so the authorization code is protected by
# PKCE instead. The redirect URI points back at this app's own Tomcat - it has to match, character
# for character, what the authorization server has registered.
spring.security.oauth2.client.registration.javafx.provider=spring
spring.security.oauth2.client.registration.javafx.client-id=javafx
spring.security.oauth2.client.registration.javafx.client-authentication-method=none
spring.security.oauth2.client.registration.javafx.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.javafx.redirect-uri=http://127.0.0.1:${server.port}/login/oauth2/code/javafx
spring.security.oauth2.client.registration.javafx.scope=openid,profile,email
#
# OIDC discovery: the authorization, token, userinfo and JWK Set endpoints are all read from
# {issuer}/.well-known/openid-configuration at startup, so the authorization server has to be up.
spring.security.oauth2.client.provider.spring.issuer-uri=http://localhost:9090
#
bootiful.oauth2.registration-id=javafx
bootiful.oauth2.login-timeout=2m
bootiful.api-uri=http://localhost:9090/userinfo
